# Veldra — central project configuration
#
# This file is the SINGLE SOURCE OF TRUTH for Veldra identity and
# versioning. Every generated file (os-release, TUI about, boot splash,
# installer, release notes) is derived from here by build scripts.
# Never hardcode versions elsewhere.
#
# This file is sourced by shell scripts. Keep it POSIX-sh-compatible.
#
# Veldra
# Copyright (c) 2026 Adrian Sikora
# All rights reserved.
# Proprietary and confidential.

# --- Identity ------------------------------------------------------------
VELDRA_ID="veldra"
VELDRA_NAME="Veldra"
VELDRA_EDITION="TUI"
VELDRA_HOSTNAME="veldra"

# --- Versioning ----------------------------------------------------------
# Format: MAJOR.MINOR.PATCH[-PRERELEASE]. Kept consistent across the
# whole project. See docs/development.md for the versioning policy.
VELDRA_VERSION_MAJOR="0"
VELDRA_VERSION_MINOR="0"
VELDRA_VERSION_PATCH="1"
VELDRA_PRERELEASE="pre-alpha"
VELDRA_VERSION="0.0.1-pre-alpha"

VELDRA_RELEASE_CHANNEL="UNSTABLE"
VELDRA_BUILD_STATUS="BOOTABLE"

# A dev cycle may carry a codename. Immortalized per milestone.
VELDRA_CODENAME="Core"

# --- Origin and authorship ------------------------------------------------
VELDRA_CREATOR="Adrian Sikora"
VELDRA_OWNER="Adrian Sikora"
VELDRA_OWNER_CONTEXT="Phantom Systems (TM)"
VELDRA_EMAIL="adriangithub@proton.me"
VELDRA_REPO="https://github.com/ADRIANo12-12/Veldra.git"
VELDRA_HOME="https://github.com/ADRIANo12-12/Veldra"
VELDRA_ISSUES="https://github.com/ADRIANo12-12/Veldra/issues"

# --- Foundation -----------------------------------------------------------
VELDRA_BASE="Arch Linux"
VELDRA_BASE_BUILD="rolling"
VELDRA_ARCH_DEFAULT="x86_64"
VELDRA_KERNEL_PACKAGE="linux"

# --- Branding paths (installed layout) ------------------------------------
VELDRA_SYSDIR="/usr/share/veldra"
VELDRA_CONFDIR="/etc/veldra"
VELDRA_THEMEDIR="${VELDRA_SYSDIR}/themes"
VELDRA_ARTWORKDIR="${VELDRA_SYSDIR}/artwork"
VELDRA_TUI_BIN="/usr/local/bin/veldra-tui"

# --- Default theme ---------------------------------------------------------
VELDRA_THEME_DEFAULT="veldra-dark"

# --- Interactive shell -----------------------------------------------------
# Only report/use this if the package is actually installed at build time.
VELDRA_SHELL="bash"
