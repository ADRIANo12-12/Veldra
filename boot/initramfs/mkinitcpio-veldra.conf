# Proprietary and confidential.
#
# This is the mkinitcpio configuration used ONLY for the Veldra live media
# initramfs (initramfs-linux-veldra.img). Installed systems keep the stock
# Arch mkinitcpio.conf (with autodetect). The live image deliberately omits
# autodetect so the initramfs carries full filesystem + block driver sets —
# it must boot from unknown hardware.

MODULES=(loop overlay squashfs sr_mod)

BINARIES=()

FILES=()

# base udev modconf block filesystems  -> standard Arch initramfs core
# veldra-live                          -> mounts the squashfs + overlay root
HOOKS=(base udev modconf block filesystems veldra-live)

COMPRESSION="zstd"